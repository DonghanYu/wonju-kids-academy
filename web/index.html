<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="robots" content="noindex, nofollow">
<title>원주 아이 학원 찾기</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>원주 아이 학원 찾기</h1>
      <p class="sub" id="meta-line">5–7세 · 후기 감성분석</p>
    </div>
    <div id="sample-banner" class="sample-banner" hidden>가상 샘플 데이터로 동작하는 데모입니다. 실제 학원이 아닙니다.</div>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="태권도, 피아노, 영어유치원…" aria-label="학원 키워드 검색">
      <button type="button" id="q-clear" class="icon-btn" aria-label="검색어 지우기" hidden>×</button>
    </form>
    <div id="recent" class="recent" hidden></div>
    <div class="chips" id="field-chips" role="group" aria-label="분야 선택"></div>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="only-pre"> 유아 전문만</label>
      <div class="sort-wrap">
        <select id="sort" aria-label="정렬">
          <option value="rec">추천순</option>
          <option value="reviews">후기 많은순</option>
          <option value="fee">수강료 낮은순</option>
        </select>
        <button type="button" class="link-btn" id="sort-help">기준</button>
      </div>
    </div>
    <div class="near-bar">
      <select id="dong" aria-label="동네 선택"></select>
      <button type="button" class="link-btn" id="backup">내 기록 백업</button>
    </div>
  </header>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <div class="compare-bar" id="compare-bar" hidden>
    <span id="compare-count"></span>
    <button type="button" class="btn primary" id="compare-open">비교하기</button>
    <button type="button" class="btn ghost" id="compare-clear">선택 해제</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <button type="button" class="icon-btn" id="sheet-close" aria-label="닫기">←</button>
      <h2 id="sheet-title"></h2>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="consult-bar" id="consult-bar"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<!--/APP-->
<script src="app.js"></script>
</body>
</html>
